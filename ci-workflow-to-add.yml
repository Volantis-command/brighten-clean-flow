# ─────────────────────────────────────────────────────────────────────
# TO ENABLE: rename this file to `.github/workflows/ci.yml` and commit
# with a GitHub token that has the `workflow` scope.
#
# The PAT used during Brendan's overnight audit run (2026-04-22) was
# created without workflow scope, so GitHub refused the push of a
# `.github/workflows/` file. The workflow itself is correct — it just
# needs a one-time commit from a browser UI or a wider-scope token.
#
# How to enable (choose one):
#
#   Option A — via GitHub UI (easiest):
#     1. On GitHub, go to the repo → Actions tab → "New workflow"
#     2. Choose "set up a workflow yourself"
#     3. Paste the content below (everything from `name: CI` onwards)
#     4. Commit to main
#
#   Option B — generate a PAT with `workflow` scope:
#     1. GitHub → Settings → Developer settings → Personal access tokens
#     2. Fine-grained or classic token with the `workflow` permission
#     3. git mv ci-workflow-to-add.yml .github/workflows/ci.yml
#     4. git commit -am "Enable CI" && git push
#
# Once merged to main, every future PR is type-checked + build-checked
# automatically. Prevents the class of schema-drift bug that ate 12 hours.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Type-check + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Vite build
        run: npm run build
