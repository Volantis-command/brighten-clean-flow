<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brightly</title>
  <script>
    // SPA fallback: store the intended path and load index.html at root
    // The React app will read this and navigate to the correct route
    sessionStorage.setItem('spa-redirect', window.location.pathname + window.location.search + window.location.hash);
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
